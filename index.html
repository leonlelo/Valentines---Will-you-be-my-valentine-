<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#1a0a0a">
  <title>Will you be my Valentine? 💕</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Quicksand:wght@500;600&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --rose: #e63946;
      --rose-dark: #c1121f;
      --pink: #ff6b6b;
      --cream: #fff5f5;
      --gold: #f4a261;
    }

    html {
      -webkit-text-size-adjust: 100%;
    }

    body {
      font-family: 'Quicksand', sans-serif;
      min-height: 100vh;
      min-height: -webkit-fill-available;
      overflow-x: hidden;
      /* Én jevn bakgrunn uten streker – lysest i midten der kortet er */
      background: radial-gradient(ellipse 120% 80% at 50% 50%, #3d1f1f 0%, #2a1515 35%, #1a0a0a 100%);
      color: var(--cream);
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    }

    /* Floating hearts background */
    .hearts-bg {
      position: fixed;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
      z-index: 0;
    }

    .heart {
      position: absolute;
      font-size: 1.5rem;
      opacity: 0.15;
      animation: float 8s ease-in-out infinite;
    }

    .heart:nth-child(1) { left: 10%; top: 20%; animation-delay: 0s; }
    .heart:nth-child(2) { left: 25%; top: 60%; animation-delay: -2s; }
    .heart:nth-child(3) { left: 60%; top: 15%; animation-delay: -4s; }
    .heart:nth-child(4) { left: 75%; top: 70%; animation-delay: -1s; }
    .heart:nth-child(5) { left: 40%; top: 85%; animation-delay: -3s; }
    .heart:nth-child(6) { left: 85%; top: 40%; animation-delay: -5s; }
    .heart:nth-child(7) { left: 15%; top: 45%; animation-delay: -6s; }
    .heart:nth-child(8) { left: 50%; top: 30%; animation-delay: -7s; }

    @keyframes float {
      0%, 100% { transform: translateY(0) rotate(0deg); opacity: 0.15; }
      50% { transform: translateY(-20px) rotate(10deg); opacity: 0.25; }
    }

    .container {
      position: relative;
      z-index: 1;
      text-align: center;
      padding: 1rem;
      max-width: 480px;
      width: 100%;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    @media (min-width: 480px) {
      .container { padding: 2rem; }
    }

    .card {
      background: linear-gradient(145deg, rgba(230, 57, 70, 0.28), rgba(193, 18, 31, 0.4));
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 24px;
      padding: 2rem 1.25rem;
      box-shadow: 0 25px 50px rgba(0,0,0,0.35), 0 0 80px rgba(230, 57, 70, 0.12);
      backdrop-filter: blur(12px);
    }

    @media (min-width: 480px) {
      .card { padding: 3rem 2rem; }
    }

    .kiss-line {
      font-size: clamp(1.5rem, 8vw, 2rem);
      letter-spacing: 0.2em;
      margin-bottom: 0.5rem;
      animation: pulse 2s ease-in-out infinite;
      font-family: "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", sans-serif;
    }

    @media (min-width: 480px) {
      .kiss-line { letter-spacing: 0.3em; }
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.8; transform: scale(1.05); }
    }

    h1 {
      font-family: 'Playfair Display', serif;
      font-size: clamp(1.5rem, 6vw, 2.2rem);
      font-weight: 700;
      margin: 0.75rem 0 1.25rem;
      line-height: 1.35;
      text-shadow: 0 2px 20px rgba(0,0,0,0.3);
    }

    @media (min-width: 480px) {
      h1 { margin: 1rem 0 1.5rem; }
    }

    .sub {
      font-size: clamp(0.9rem, 2.5vw, 0.95rem);
      opacity: 0.9;
      margin-bottom: 1.5rem;
    }

    @media (min-width: 480px) {
      .sub { margin-bottom: 2rem; }
    }

    .buttons {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    @media (min-width: 480px) {
      .buttons {
        flex-direction: row;
        flex-wrap: wrap;
        gap: 1rem;
      }
    }

    .btn {
      font-family: 'Quicksand', sans-serif;
      font-size: clamp(1.1rem, 4vw, 1.2rem);
      font-weight: 600;
      min-height: 48px;
      min-width: 140px;
      padding: 0.875rem 1.5rem;
      border: none;
      border-radius: 50px;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
      position: relative;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }

    @media (min-width: 480px) {
      .btn {
        min-width: auto;
        padding: 1rem 2rem;
      }
    }

    .btn-yes {
      background: linear-gradient(135deg, #e63946, #c1121f);
      color: white;
      box-shadow: 0 8px 25px rgba(230, 57, 70, 0.5);
    }

    .btn-yes:hover {
      transform: scale(1.08);
      box-shadow: 0 12px 35px rgba(230, 57, 70, 0.6);
    }

    .btn-yes:hover:active,
    .btn-yes:active {
      transform: scale(0.98);
    }

    @media (hover: none) {
      .btn-yes:active { transform: scale(0.97); }
    }

    .btn-no {
      background: rgba(255,255,255,0.15);
      color: var(--cream);
      border: 2px solid rgba(255,255,255,0.3);
    }

    .btn-no:hover {
      transform: scale(1.05);
    }

    /* Success state */
    .success {
      display: none;
    }

    .success.show {
      display: block;
      animation: popIn 0.5s ease-out;
    }

    @keyframes popIn {
      from {
        opacity: 0;
        transform: scale(0.8);
      }
      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    .success .big-hearts {
      font-size: clamp(3rem, 15vw, 4rem);
      margin: 1rem 0;
      animation: bounce 0.6s ease infinite;
      font-family: "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", sans-serif;
    }

    @keyframes bounce {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.2); }
    }

    .success h2 {
      font-family: 'Playfair Display', serif;
      font-size: clamp(1.5rem, 5vw, 1.8rem);
      margin-bottom: 0.5rem;
      color: #ffccd5;
    }

    .success p {
      font-size: clamp(0.95rem, 2.5vw, 1rem);
      opacity: 0.95;
    }

    .btn-back {
      display: inline-block;
      margin-top: 1.25rem;
      font-family: 'Quicksand', sans-serif;
      font-size: 0.9rem;
      color: rgba(255, 255, 255, 0.75);
      background: none;
      border: none;
      cursor: pointer;
      text-decoration: underline;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }

    .btn-back:hover {
      color: rgba(255, 255, 255, 0.95);
    }

    /* Confetti / hearts explosion */
    .celebration {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 100;
    }

    .celebration span {
      position: absolute;
      font-size: 1.5rem;
      animation: fly 3s ease-out forwards;
      opacity: 1;
      transform: translate(-50%, -50%);
      font-family: "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", sans-serif;
    }

    @keyframes fly {
      0% {
        opacity: 1;
        transform: translate(-50%, -50%) scale(1) rotate(0deg);
      }
      100% {
        opacity: 0;
        transform: translate(calc(-50% + var(--tx)), calc(-50% + var(--ty))) scale(0) rotate(720deg);
      }
    }

    /* No-button run away */
    .question.hide-buttons .buttons {
      opacity: 0;
      pointer-events: none;
    }

    .no-escape-msg {
      display: none;
      margin-top: 1rem;
      font-size: 0.95rem;
      color: #ffb3ba;
      animation: shake 0.5s ease;
    }

    .no-escape-msg.show {
      display: block;
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-5px); }
      75% { transform: translateX(5px); }
    }

    .runaway-wrapper {
      position: relative;
      display: inline-block;
      transition: left 0.25s ease-out, top 0.25s ease-out;
    }

    .runaway-wrapper.runaway {
      position: fixed;
      margin: 0;
      z-index: 10;
    }

    /* Nei-knapp bred nok på mobil for at den skal være lett å "jage" */
    .runaway-wrapper .btn-no {
      min-width: 120px;
    }
  </style>
</head>
<body>
  <div class="hearts-bg" aria-hidden="true">
    <span class="heart">❤️</span>
    <span class="heart">💕</span>
    <span class="heart">💗</span>
    <span class="heart">❤️</span>
    <span class="heart">💕</span>
    <span class="heart">💗</span>
    <span class="heart">❤️</span>
    <span class="heart">💕</span>
  </div>

  <div class="container">
    <div class="card">
      <div class="question" id="question">
        <p class="kiss-line">💋 💋 💋</p>
        <h1>Vil du være min valentine?</h1>
        <p class="sub">(Say yes. Please.)</p>
        <div class="buttons">
          <button class="btn btn-yes" id="btnYes" type="button">Ja! 💕</button>
          <div class="runaway-wrapper" id="runawayWrapper">
            <button class="btn btn-no" id="btnNo" type="button">Nei</button>
          </div>
        </div>
        <p class="no-escape-msg" id="noMsg">Feil svar. Prøv igjen. 😏</p>
      </div>

      <div class="success" id="success">
        <p class="kiss-line">💋 ❤️ 💋</p>
        <div class="big-hearts">💕 ❤️ 💕</div>
        <h2>Jeg elsker deg!</h2>
        <p>Takk for at du sa ja. Nå er vi valentines. </p>
        <button type="button" class="btn-back" id="btnBack">Tilbake</button>
      </div>
    </div>
  </div>

  <div class="celebration" id="celebration" aria-hidden="true"></div>

  <script>
    const STORAGE_KEY = 'valentine-answer';
    const question = document.getElementById('question');
    const success = document.getElementById('success');
    const btnYes = document.getElementById('btnYes');
    const btnNo = document.getElementById('btnNo');
    const btnBack = document.getElementById('btnBack');
    const noMsg = document.getElementById('noMsg');
    const celebration = document.getElementById('celebration');
    const runawayWrapper = document.getElementById('runawayWrapper');

    const noMessages = [
      'Feil svar. Prøv igjen. 😏',
      'Sikker? Tenk deg om...',
      'Nei til nei. Velg Ja.',
      'Du trykker feil knapp...',
      'Jeg hører ikke det der.',
      'En gang til? 🙏',
      'Pretty please?',
      'Siste sjanse før jeg gråter.',
    ];
    let noClicks = 0;

    function showQuestion() {
      question.style.display = 'block';
      question.classList.remove('hide-buttons');
      success.classList.remove('show');
      runawayWrapper.classList.remove('runaway');
      runawayWrapper.style.left = '';
      runawayWrapper.style.top = '';
    }

    function showSuccess(animate) {
      question.classList.add('hide-buttons');
      setTimeout(() => {
        question.style.display = 'none';
        success.classList.add('show');
        if (animate) fireCelebration();
      }, animate ? 300 : 0);
    }

    /* Ved lasting: vis lagret svar */
    (function init() {
      try {
        const saved = localStorage.getItem(STORAGE_KEY);
        if (saved === 'yes') {
          showSuccess(false);
        } else {
          showQuestion();
        }
      } catch (e) {
        showQuestion();
      }
    })();

    btnYes.addEventListener('click', () => {
      try { localStorage.setItem(STORAGE_KEY, 'yes'); } catch (e) {}
      showSuccess(true);
    });

    function moveNoButton(wrapper) {
      const rect = wrapper.getBoundingClientRect();
      wrapper.classList.add('runaway');
      wrapper.style.left = rect.left + 'px';
      wrapper.style.top = rect.top + 'px';
      requestAnimationFrame(() => {
        const pad = 24;
        const maxX = window.innerWidth - rect.width - pad;
        const maxY = window.innerHeight - rect.height - pad;
        wrapper.style.left = Math.max(pad, Math.random() * maxX) + 'px';
        wrapper.style.top = Math.max(pad, Math.random() * maxY) + 'px';
      });
    }

    btnNo.addEventListener('mouseenter', (e) => {
      moveNoButton(e.target.closest('.runaway-wrapper'));
    });

    btnNo.addEventListener('touchstart', (e) => {
      moveNoButton(e.target.closest('.runaway-wrapper'));
      e.preventDefault();
    }, { passive: false });

    btnNo.addEventListener('click', (e) => {
      e.preventDefault();
      try { localStorage.setItem(STORAGE_KEY, 'no'); } catch (e) {}
      noClicks++;
      noMsg.textContent = noMessages[Math.min(noClicks - 1, noMessages.length - 1)];
      noMsg.classList.add('show');
      setTimeout(() => noMsg.classList.remove('show'), 1500);
    });

    btnBack.addEventListener('click', () => {
      showQuestion();
    });

    function fireCelebration() {
      const symbols = ['❤️', '💕', '💗', '💋', '💖'];
      const centerX = window.innerWidth / 2;
      const centerY = window.innerHeight / 2;

      for (let i = 0; i < 50; i++) {
        const el = document.createElement('span');
        el.textContent = symbols[Math.floor(Math.random() * symbols.length)];
        el.style.left = centerX + 'px';
        el.style.top = centerY + 'px';
        const angle = (i / 50) * Math.PI * 2 + Math.random();
        const dist = 150 + Math.random() * 200;
        const tx = Math.cos(angle) * dist + (Math.random() - 0.5) * 100;
        const ty = Math.sin(angle) * dist + (Math.random() - 0.5) * 100;
        el.style.setProperty('--tx', tx + 'px');
        el.style.setProperty('--ty', ty + 'px');
        el.style.animationDelay = (i * 0.02) + 's';
        celebration.appendChild(el);
        setTimeout(() => el.remove(), 3200);
      }
    }
  </script>
</body>
</html>
